name: Revisar señales

on:
  repository_dispatch:
    types: [check-signals]
  workflow_dispatch: {}      # permite lanzarlo a mano desde GitHub también

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar señales
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cloud/check_signals_once.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/codere_odds_log.csv data/signals_log.csv
          git diff --cached --quiet || git commit -m "Nuevas cuotas / señales"
          git pull --rebase --autostash
          git push
